spring.application.name=api-vendas

# Configuracao do banco de dados MySQL - Producao
spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:mysql://localhost:3306/hanami_db?serverZoneId=UTC}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


# Swagger/OpenAPI
springdoc.api-docs.path=/docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# WebFlux multipart/codec limits
spring.webflux.multipart.max-in-memory-size=5MB
spring.codec.max-in-memory-size=5MB

# Configuracoes de logging - Producao
logging.file.name=logs/app.log
logging.level.root=INFO
logging.level.com.recode.hanami=INFO
logging.level.org.springframework.web=WARN

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=7
