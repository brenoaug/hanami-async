spring.application.name=api-vendas

# Configuracao do banco de dados MySQL - Desenvolvimento Local
spring.r2dbc.url=r2dbc:mysql://localhost:3306/hanami_db?serverZoneId=UTC
spring.r2dbc.username=root
spring.r2dbc.password=root
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Swagger/OpenAPI
springdoc.api-docs.path=/docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# WebFlux multipart/codec limits
spring.webflux.multipart.max-in-memory-size=5MB

# Configuracoes de logging
logging.file.name=logs/app.log
logging.level.root=INFO
logging.level.com.recode.hanami=DEBUG
logging.level.org.springframework.web=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=7

# logs detalhados para diagnosticar DDL/SQL
logging.level.org.springframework.r2dbc=DEBUG
logging.level.io.r2dbc.spi=DEBUG
logging.level.org.springframework.data.r2dbc=DEBUG
logging.level.org.springframework.r2dbc.connection.init=DEBUG
